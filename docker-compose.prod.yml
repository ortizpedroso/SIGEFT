services:
  db:
    image: postgres:15-alpine
    container_name: metrica_db_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrica_api_prod
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      SECRET_KEY: "${SECRET_KEY}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@tjrr.jus.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ENV: "${ENV:-production}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-api,localhost,127.0.0.1}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: metrica_web_prod
    environment:
      API_URL: "http://api:8000"
      NODE_ENV: production
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: metrica_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
