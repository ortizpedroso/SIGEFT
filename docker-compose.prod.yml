services:
  db:
    image: postgres:15-alpine
    container_name: metrica_db_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrica_api_prod
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      SECRET_KEY: "${SECRET_KEY}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@tjrr.jus.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrica_web_prod
    ports:
      - "3001:3000"
    environment:
      API_URL: "http://api:8000"
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
