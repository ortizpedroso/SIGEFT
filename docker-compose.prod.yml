# Produção na VPS compartilhada (www.eventosbr.app.br já usa 80/443 via Caddy).
# A Métrica NÃO publica 80/443. O Caddy do eventosbr faz o proxy.
#
# Nomes de container únicos (metrica_*) para não colidir com o serviço
# `api` do eventosbr na rede compartilhada — senão o login vira 404 Not Found.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   bash deploy/hook-eventosbr-caddy.sh

services:
  db:
    image: postgres:15-alpine
    container_name: metrica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-metrica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-metrica}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-metrica} -d ${DB_NAME:-metrica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrica_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-metrica}:${DB_PASSWORD}@metrica_db:5432/${DB_NAME:-metrica}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY com 32+ caracteres}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sigep.inovesw.com.br}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-sigep.inovesw.com.br,metrica_api,api,localhost,127.0.0.1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tjrr.jus.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      ENV: production
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: metrica_web
    restart: unless-stopped
    environment:
      API_URL: http://metrica_api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
    networks:
      - default
      - eventosbr_internal

volumes:
  postgres_data:

networks:
  eventosbr_internal:
    external: true
    name: eventosbr_eventosbr_internal
