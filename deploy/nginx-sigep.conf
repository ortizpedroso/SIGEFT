# Cole em /etc/nginx/sites-available/sigep (Debian/Ubuntu) ou
# /etc/nginx/conf.d/sigep.conf e recarregue o Nginx.
#
# Hostname = o A que aponta para o IP da VPS, por exemplo:
#   sigep.inovesw.cm.br     (DNS do plano Hostinger; NÃO criar como site no hPanel)
#   sigep.eventosbr.app.br  (DNS do eventosbr na própria VPS)
# Troque server_name e os caminhos do Let's Encrypt abaixo.
# Ver deploy/dns-subdominio.txt
#
# NÃO substitua o vhost de www.eventosbr.app.br.

server {
    listen 80;
    listen [::]:80;
    server_name sigep.inovesw.cm.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sigep.inovesw.cm.br;

    # Certbot preenche estes caminhos:
    ssl_certificate     /etc/letsencrypt/live/sigep.inovesw.cm.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigep.inovesw.cm.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
