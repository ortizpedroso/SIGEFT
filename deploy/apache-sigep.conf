# Cole em /etc/apache2/sites-available/sigep.conf (Debian/Ubuntu)
# a2enmod proxy proxy_http headers ssl rewrite
# a2ensite sigep
# certbot --apache -d sigep.eventosbr.app.br
#
# NÃO desative o vhost de www.eventosbr.app.br.

<VirtualHost *:80>
    ServerName sigep.eventosbr.app.br
    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName sigep.eventosbr.app.br
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/sigep.eventosbr.app.br/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/sigep.eventosbr.app.br/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</VirtualHost>
